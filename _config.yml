theme: jekyll-theme-chirpy

lang: es-DO

timezone: America/Santo_Domingo

title: ajente007 

tagline: writeups 

description: >-
  A minimal, responsive and feature-rich Jekyll theme for technical writing.
url: "https://ajente007.github.io"

github:
  username: ajente007 

social:
  name: ajente007
  email: 
  links:
    
    - https://github.com/ajente007
  
webmaster_verifications:
  google: 

analytics:
  google:
    id: 
  goatcounter:
    id:
  umami:
    id: 
    domain: 
  matomo:
    id:
    domain: 
  cloudflare:
    id:
  fathom:
    id: 

pageviews:
  provider: 

theme_mode: 
cdn:

avatar: /assets/img/Mr.jpg

social_preview_image: 
toc: true

comments:
  provider: 
  disqus:
    shortname: 
  utterances:
    repo: 
    issue_term: 

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position: 
    lang:
    reactions_enabled:
    
assets:
  self_host:
    enabled: 
    env:

pwa:
  enabled: false 
  cache:
    enabled: true 
    deny_paths:

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" 
      type: posts
    values:
      layout: post
      comments: true 
      toc: true 
      
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

